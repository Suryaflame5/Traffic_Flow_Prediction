version: '3.9'

services:
  backend:
    build: .
    container_name: Traffic_Flow_Prediction_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - OMP_NUM_THREADS=1
    volumes:
      - ./saved_models:/app/saved_models
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: Traffic_Flow_Prediction_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped
